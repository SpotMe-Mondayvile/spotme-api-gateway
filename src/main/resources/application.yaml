spring:
  application:
     name: spotme-api-gateway
  cloud:
    gateway:
      mvc:
        enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            # allowedHeaders: "*"
            allowCredentials: true # Allow credentials (e.g., cookies, authorization headers)

      routes:
        - id: auth-svc-route
          uri: ${AUTH_SVC_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>.*), /api/v1/auth$\{segment}
            - AddResponseHeader=X-Powered-By,SpotMe Gateway Service

        - id: rest-svc-route
          uri: ${REST_SVC_URL:http://localhost:8087}
          predicates:
            - Path=/rest/**
          filters:
            - RewritePath=/rest(?<segment>.*), $\{segment}
            - AddResponseHeader=X-Powered-By,SpotMe Gateway Service

        - id: rest-swagger-docs
          uri: ${REST_SVC_URL:http://localhost:8087}
          predicates:
              - Path=/rest-docs/** # Client hits this path on the Gateway

        - id: user-svc-route
          uri: ${USER_SVC_URL:http://localhost:8082}
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user(?<segment>.*), /api/v1/user$\{segment}
            - AddResponseHeader=X-Powered-By,SpotMe Gateway Service

        - id: match-svc-route
          uri: ${MATCH_SVC_URL:http://localhost:8083}
          predicates:
            - Path=/api/match/**
          filters:
            - RewritePath=/api/match(?<segment>.*), /api/v1/match$\{segment}
            - AddResponseHeader=X-Powered-By,SpotMe Gateway Service

        - id: gym-svc-route
          uri: ${GYM_SVC_URL:http://localhost:8084}
          predicates:
            - Path=/api/gym/**
          filters:
            - RewritePath=/api/gym(?<segment>.*), /api/v1/gym$\{segment}
            - AddResponseHeader=X-Powered-By,SpotMe Gateway Service

        - id: friends-svc-route
          uri: ${FRIENDS_SVC_URL:http://localhost:8085}
          predicates:
            - Path=/api/friends/**
          filters:
            - RewritePath=/api/friends(?<segment>.*), /api/v1/friends\{segment}
            - AddResponseHeader=X-Pow ered-By,SpotMe Gateway Service

        - id: posts-route
          uri: ${POSTS_ROUTE_URI:http://localhost:8086}
          predicates:
            - Path=/posts/**
          filters:
            - RewritePath=/info(?<segment>.*), /api/v1/info$\{segment}
            - AddResponseHeader=X-Powered-By,SpotMe Gateway Service

        - id: info-route
          uri: http://localhost:8080
          predicates:
            - Path=/info**
          filters:
            - RewritePath=/info(?<segment>.*), /api/v1/info$\{segment} #/api/v1/movies/$\{segment}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      -   name: gateway-service
          url: /v3/api-docs

      -   name: auth-service
          url: /auth/api-docs

      -   name: rest-service
          url: /rest/api-docs

      -   name: user-service
          url: /api-docs

      -   name: match-service
          url: /api-docs

      -   name: gym-service
          url: /api-docs

      -   name: friends-service
          url: /api-docs

      -   name: posts-service
          url: /api-docs

      -   name: info-service
          url: /api-docs
